[package]
name = "peek"
version = "0.1.0"
license = "MIT"
description = "Hand your work & questions to Acode anytime."
authors = ["you"]
edition = "2021"
default-run = "Acode"

[[bin]]
name = "Acode"
path = "src/main.rs"

[[bin]]
name = "acode-eval"
path = "src/bin/acode_eval.rs"

[[bin]]
name = "acode-browser-bridge"
path = "src/bin/acode_browser_bridge.rs"

[[bin]]
name = "acode-plugin-host"
path = "src/bin/acode_plugin_host.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "peek_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
dirs = "6"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
json5 = "0.4"
notify-rust = "4.18"
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "native-tls", "blocking", "system-proxy", "socks", "multipart"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
tokio = { version = "1", features = ["sync", "time", "process", "rt-multi-thread", "macros", "net", "io-util"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["handshake", "connect"] }
qrcode = { version = "0.14", default-features = false, features = ["image"] }
rdev = "0.5"
glob = "0.3"
zip = { version = "2", default-features = false, features = ["deflate"] }
walkdir = "2"
portable-pty = "0.8"
regex = "1"
similar = "2"
uuid = { version = "1", features = ["v4", "serde"] }
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg", "bmp", "png", "gif", "webp"] }
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png", "macos-private-api"] }
urlencoding = "2.1"
encoding_rs = "0.8"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
md-5 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
tokenizers = { version = "0.23", default-features = false, features = ["fancy-regex"] }
tiktoken-rs = "0.12"
tauri-plugin-process = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

[target.'cfg(windows)'.dependencies]
ghost-session = { git = "https://github.com/NORTHTEKDevs/ghost", tag = "v0.23.4", package = "ghost-session" }
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Accessibility",
    "Win32_System_Threading",
    "Win32_System_JobObjects",
    "Win32_Security",
    "Win32_System_ProcessStatus",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_Storage_FileSystem",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Data_Xml_Dom",
    "Foundation_Collections",
    "UI_Notifications",
    "implement",
] }

[target.'cfg(target_os = "macos")'.dependencies]
arboard = "3"
core-foundation = "0.10"
core-graphics = "0.25"
objc = "0.2"

# macOS 27 rejects proc-macro dylibs after rustc 1.97 strips them (rust-lang/rust#157750).
[profile.release.build-override]
strip = "none"

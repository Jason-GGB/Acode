<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Acode mascot</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f6f1e8;
        color: #242424;
        font-family: "Segoe UI", sans-serif;
      }
      figure {
        margin: 0;
        text-align: center;
      }
      img {
        width: min(420px, 80vw);
        height: auto;
        border-radius: 28px;
      }
      figcaption {
        margin-top: 12px;
      }
    </style>
  </head>
  <body>
    <figure>
      <img src="mascot.png" alt="Acode mascot" />
      <figcaption>public/mascot/mascot.png</figcaption>
    </figure>
  </body>
</html>
